# 应用配置
app:
  name: "qs-service"
  version: "0.1.0"
  debug: true
  env: "development"

# 服务器配置
server:
  host: "0.0.0.0"
  port: 8000
  cors:
    origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "http://127.0.0.1:3000"
      - "*"

# 数据库配置
database:
  url: "sqlite+aiosqlite:///./app.db"
  echo: false
  pool_size: 5
  max_overflow: 10

# JWT配置
jwt:
  secret_key: "your-secret-key-change-in-production"
  algorithm: "HS256"
  access_token_expire_minutes: 30
  refresh_token_expire_days: 7

# 日志配置
logging:
  level: "INFO"
  rotation: "20 MB"
  retention: "10 days"

# 调度器配置
scheduler:
  enabled: true
  timezone: "Asia/Shanghai"
  max_workers: 10
